<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>AI Assistant | Mohan Kumar K</title>
	<!-- PWA & Mobile Optimizations (Android, iOS, Windows) -->
	<meta name="theme-color" content="#040e09">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="MK Forest">
	<meta name="format-detection" content="telephone=no">
	<link rel="apple-touch-icon" href="apple-touch-icon.png">
	<link rel="manifest" href="manifest.json">
	<!-- Inter Font for the clean Apple aesthetic -->
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<!-- FontAwesome for Icons -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="style.css">
	<script src="theme.js"></script>
	<!-- MK Creative AI Chat Engine -->
	<script src="chat.js" defer></script>
	<!-- Google Analytics (Visitor Monitoring) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() { dataLayer.push(arguments); }
		gtag('js', new Date());
		gtag('config', 'G-XXXXXXXXXX');
	</script>
</head>

<body>


	<!-- Sunbeam Light Rays Overlay (Day Mode Graphic) -->
	<div class="sunbeam-overlay"></div>

	<!-- Glass Blur Shield (Gaussian Blur Glass Panel) -->
	<div class="glass-blur-shield"></div>

	<!-- Forest Water Stream (Animated Day & Night Brook) -->
	<div class="forest-water-stream">
		<div class="water-layer water-layer-back"></div>
		<div class="water-layer water-layer-mid"></div>
		<div class="water-layer water-layer-front"></div>
		<div class="water-glint glint-1"></div>
		<div class="water-glint glint-2"></div>
		<div class="water-glint glint-3"></div>
	</div>

	<!-- Nature Ambient Overlay (Bioluminescent Fireflies, Wind Streams, Day & Night Leaves) -->
	<div class="nature-ambient-overlay">
		<!-- Atmospheric Wind Breeze Streams -->
		<div class="wind-stream wind-stream-1"></div>
		<div class="wind-stream wind-stream-2"></div>
		<div class="wind-stream wind-stream-3"></div>

		<!-- Night Fireflies -->
		<div class="firefly firefly-1" style="top: 18%; left: 12%; animation-delay: 0s;"></div>
		<div class="firefly firefly-2" style="top: 38%; left: 28%; animation-delay: 1.8s;"></div>
		<div class="firefly firefly-3" style="top: 72%; left: 14%; animation-delay: 0.9s;"></div>
		<div class="firefly firefly-1" style="top: 25%; left: 58%; animation-delay: 2.4s;"></div>
		<div class="firefly firefly-2" style="top: 62%; left: 48%; animation-delay: 1.3s;"></div>
		<div class="firefly firefly-3" style="top: 14%; left: 82%; animation-delay: 3.1s;"></div>
		<div class="firefly firefly-1" style="top: 84%; left: 72%; animation-delay: 0.6s;"></div>
		<div class="firefly firefly-2" style="top: 32%; left: 88%; animation-delay: 2.7s;"></div>
		<div class="firefly firefly-3" style="top: 68%; left: 82%; animation-delay: 1.9s;"></div>
		<div class="firefly firefly-glow" style="top: 45%; left: 8%; animation-delay: 3.5s;"></div>
		<div class="firefly firefly-glow" style="top: 22%; left: 75%; animation-delay: 1.5s;"></div>
		<div class="firefly firefly-glow" style="top: 78%; left: 32%; animation-delay: 2.2s;"></div>

		<!-- Night Bioluminescent Leaves & Spores -->
		<div class="leaf-mote leaf-night-emerald" style="top: 12%; left: 22%; animation-delay: 1s;"></div>
		<div class="leaf-mote leaf-night-teal" style="top: 50%; left: 18%; animation-delay: 3s;"></div>
		<div class="leaf-mote leaf-night-emerald" style="top: 70%; left: 80%; animation-delay: 0.5s;"></div>
		<div class="leaf-mote leaf-spore" style="top: 35%; left: 65%; animation-delay: 2s;"></div>
		<div class="leaf-mote leaf-spore" style="top: 80%; left: 40%; animation-delay: 1.2s;"></div>

		<!-- Day Multi-Species Leaves & Sun Pollen Motes -->
		<div class="leaf-mote leaf-birch" style="top: 6%; left: 12%; animation-delay: 0s;"></div>
		<div class="leaf-mote leaf-maple" style="top: 15%; left: 38%; animation-delay: 2.4s;"></div>
		<div class="leaf-mote leaf-fern" style="top: 10%; left: 75%; animation-delay: 1.2s;"></div>
		<div class="leaf-mote leaf-birch" style="top: 45%; left: 85%; animation-delay: 3.6s;"></div>
		<div class="leaf-mote leaf-maple" style="top: 60%; left: 20%; animation-delay: 0.8s;"></div>
		<div class="leaf-mote leaf-fern" style="top: 78%; left: 65%; animation-delay: 2.8s;"></div>
		<div class="leaf-mote leaf-pollen" style="top: 28%; left: 52%; animation-delay: 1.5s;"></div>
		<div class="leaf-mote leaf-pollen" style="top: 55%; left: 78%; animation-delay: 3.1s;"></div>
		<div class="leaf-mote leaf-pollen" style="top: 82%; left: 15%; animation-delay: 0.4s;"></div>
	</div>

	<!-- Header / Top Navigation -->
	<header>
		<div class="brand" onclick="window.location.href = 'index.html'">
			<img src="logo_transparent.png" alt="Mohan Logo">
			<span class="brand-name">Mohan</span>
		</div>
		<nav class="tabs">
			<a href="index.html" id="tab-home" class="tab-link">Home</a>
			<a href="socials.html" id="tab-socials" class="tab-link">Socials</a>
			<a href="achievements.html" id="tab-achievements" class="tab-link">Achievements</a>
			<a href="files.html" id="tab-files" class="tab-link">Shared Files</a>
			<a href="ai.html" id="tab-ai" class="tab-link active">AI Assistant</a>
		</nav>
		<div class="header-actions">
			<div class="live-clock" id="live-clock" title="Current Time">
				<span class="live-clock-dot"></span>
				<span class="live-clock-time">--:--:--</span>
			</div>
			<button id="theme-toggle" class="theme-switch" aria-label="Toggle theme">
				<span class="theme-switch-track">
					<span class="theme-switch-icon switch-light-label"><i class="fas fa-sun"></i></span>
					<span class="theme-switch-icon switch-dark-label"><i class="fas fa-moon"></i></span>
				</span>
				<span class="theme-switch-thumb"></span>
			</button>
		</div>
	</header>

	<!-- Main Content Area -->
	<main>
		<div id="content-area">
			<!-- AI Tab Content -->
			<div id="panel-ai" class="tab-panel active">
				<div class="liquid-glass-chat">
					<!-- Header -->
					<div class="chat-header">
						<div class="chat-brand">
							<div class="bot-avatar">
								<i class="fas fa-robot"></i>
							</div>
							<div class="chat-title-info">
								<h3>AI Assistant</h3>
								<span class="chat-status">
									<span class="status-dot"></span>
									<span>Online</span>
								</span>
							</div>
						</div>
					</div>

					<!-- Chat Area -->
					<div id="tab-chat-messages" class="chat-messages-area">
						<!-- Welcome message loaded by JS -->
					</div>

					<!-- Typing Indicator -->
					<div id="tab-chat-typing" class="chat-typing-indicator" style="display: none;">
						<span class="typing-dot"></span>
						<span class="typing-dot"></span>
						<span class="typing-dot"></span>
					</div>

					<!-- Input Footer -->
					<div class="chat-footer">
						<textarea id="tab-chat-input" placeholder="Ask me about Mohan Kumar K's workspace..." rows="1"
							onkeydown="handleChatInputKey(event)"></textarea>
						<button id="tab-chat-send-btn" onclick="sendChatMessage()">
							<i class="fas fa-paper-plane"></i>
						</button>
					</div>
				</div>
			</div>
		</div>
	</main>

	<!-- Floating Feedback Widget -->
	<div id="feedback-container">
		<button id="feedback-trigger" class="feedback-trigger-btn" aria-label="Toggle Feedback Form">
			<i class="far fa-star"></i>
		</button>
		<div id="feedback-window" class="feedback-window">
			<div class="feedback-header">
				<h3>Send Feedback</h3>
				<button class="feedback-close-btn" onclick="toggleFeedback()">&times;</button>
			</div>
			<form id="feedback-form">
				<div class="feedback-input-group">
					<input type="text" id="feedback-name" name="name" placeholder="Your Name (Optional)">
				</div>
				<div class="feedback-input-group">
					<input type="email" id="feedback-email" name="email" placeholder="Your Email (Optional)">
				</div>
				<div class="feedback-input-group">
					<textarea id="feedback-message" name="message"
						placeholder="Describe your experience or suggest improvements..." required rows="4"></textarea>
				</div>
				<button type="submit" class="feedback-submit-btn">Send Feedback</button>
				<div id="feedback-status" class="feedback-status-msg"></div>
			</form>
		</div>
	</div>
</body>

</html>
